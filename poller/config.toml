  "chief",
  "p eng",
  "peng",
  "professional engineer",
  "licensed engineer",
  "engineer in training",
]

# ---------------------------------------------------------------------------
# The technical pre-sales track: sales engineering, solutions engineering and
# the rest of the customer-facing side of engineering, where a CS degree is the
# requirement rather than a nice-to-have.
#
# It is a TRACK, not more role keywords, because it is a different job. Every
# title below is a software-side EXCLUSION a few lines up, and deliberately so:
# a Sales Engineer has no business in a list of software engineering roles.
# Giving it its own track keeps that true while still carrying the roles, and
# the dashboard filters on `track` so neither one buries the other.
#
# Turning `enabled` off puts every title below back to being nothing but a
# software-side exclusion, which is the old behaviour exactly.
# ---------------------------------------------------------------------------
[match.presales]
enabled = true
label = "technical sales"

# A pre-sales req almost never says "new grad" in its title, and where it
# states a bar at all it states it in the description, which the years tier
# already reads. Without this the track would hold only the few that happen to
# say "Associate". This is a separate switch from the software side's, which
# stays Canadian-boards-only for the reason recorded above: there the open
# level tier competes with ~2400 other roles, here the whole track is small.
open_level = true

# Titles. Multi-word on purpose, the same rule the software list follows: a
# bare "sales" would take every account executive on every board, and a bare
# "consultant" every management consultancy.
#
# Deliberately NOT here: "Account Executive" on its own, "Business Development
# Representative", "Sales Development Representative" and "Account Manager".
# Those are quota-carrying or prospecting roles where the CS degree is
# decoration, and including them would have swamped the track with exactly the
# generic sales job it exists to avoid. "Technical Account Executive" is in,
# because the word technical is what makes it a different job.
role_keywords = [
  "sales engineer",
  "sales engineering",
  "solutions engineer",
  "solution engineer",
  "solutions engineering",
  "presales",
  "pre sales",
  "solutions consultant",
  "solution consultant",
  "technical solutions consultant",
  "technical solutions specialist",
  "technical solutions analyst",
  "technical sales",
  # Google's name for the pre-sales engineer, and a real early-career pipeline.
  "customer engineer",
  "technical account executive",
  # "Forward Deployed Engineer" was here and was removed on measurement. The
  # committed feed already carries seven of them, all new grad, all matched on
  # the software track, and they are software roles: an FDE writes code at the
  # customer's site. Claiming them for this track would have moved seven real
  # engineering jobs out of the software filter and gained nothing.
]

# On top of everything the software track excludes. Seniority, management and
# the level suffixes are shared and are not repeated here; only the words that
# separate a technical pre-sales role from the other things called "sales
# engineer" are.
#
# "Sales Engineer" is an old industrial title as well as a software one, and a
# board search returns as many pump and HVAC reqs as SaaS ones. These are the
# physical-goods giveaways. Vertical names like insurance or healthcare are
# NOT here: at a software company those describe the customer, not the job, so
# excluding them would drop real roles.
exclude_keywords = [
  "hvac",
  "mechanical sales",
  "industrial sales",
  "equipment sales",
  "outside sales",
  "inside sales",
  "retail sales",
  "territory sales",
  "field sales",
  "pump",
  "pumps",
  "valve",
  "valves",
  "compressor",
  "compressors",
  "boiler",
  "boilers",
  "roofing",
  "solar sales",
  # "automotive" on its own is a vertical a software company sells into, so it
  # would drop real roles. The sales half is what makes it a car dealership.
  "automotive sales",
  "car sales",
  "door to door",
  "appointment setter",
  "closer",
  "coaching",
  "business development representative",
  "sales development representative",
  "bdr",
  "sdr",
  # Added after auditing the first 138 roles the track produced. These are
  # categories that will keep arriving, not one-offs: a Technical Sales
  # Representative is a salesperson with a technical product, which is the
  # generic sales job this track exists to avoid, and "Solutions Engineer" is
  # also what several companies call the person who runs their own internal
  # IT or recruiting tooling. Neither talks to a customer about architecture.
  "sales representative",
  "sales executive",
  "sales analyst",
  "sales specialist",
  "it solutions",
  "it solution",
  "recruiting",
  "talent acquisition",
  # The industrial meaning again, from the same audit.
  "electrical sales",
  "hardware solutions",
  # A startup's first sales engineer, hired to build the function. The word is
  # a seniority marker in the same way "principal" is, and it is scoped to
  # this track rather than added to the shared list, where it would also have
  # reached four software roles that are a different judgement call.
  "founding",
]

# ---------------------------------------------------------------------------
# The infrastructure track: systems administration, systems analysis,
# infrastructure, networking, IT operations, cloud and platform operations,
# security operations, OT and SCADA, telecommunications, rail and
# transportation technology, energy and utilities technology, and public
# sector IT.
#
# One track rather than twelve. They are one labour market: the same person
# moves between them, the same CS degree and Linux background qualifies for
# all of them, and a dashboard with twelve filters is a dashboard nobody uses.
#
# Three things make this track behave differently from the software one, and
# all three are deliberate.
#
# CANADA ONLY, BUT ONLY WHERE IT HAS TO BE. `open_level_regions` restricts the
# permissive tier and nothing else. "Systems Analyst" with no seniority marker
# is one of the most common job titles in North America, and accepting it from
# every US board would bury the Canadian roles this track exists to find under
# thousands of American ones.
#
# Restricting the WHOLE track was tried first and measured before shipping: it
# would have dropped 176 roles the board already carried, 174 of which held a
# real early career signal. A US posting that says new grad, or states a bar of
# nought to three years, has earned its place and still gets in.
#
# NOT GATED ON THE WORD JUNIOR. `open_level` is on, so a title carrying no
# seniority marker at all is accepted. A Systems Administrator posting almost
# never says "new grad", and requiring it would empty the track. The level is
# still recorded, so "level not stated" stays filterable.
#
# FOUR YEARS, NOT THREE. A posting saying "2+ years preferred" is reachable
# with a degree and projects; one saying "5+ years" is not. Four is where that
# line falls, and it is per-track rather than global so the software side is
# unchanged.
# ---------------------------------------------------------------------------
[match.infrastructure]
enabled = true
label = "infrastructure"
open_level = true
max_years_experience = 4
open_level_regions = ["CA"]

# Titles, by the family they come from. Multi-word wherever a single word
# would be ambiguous: a bare "network" takes Network Marketing, a bare
# "control" takes Quality Control, and a bare "operations" takes everything.
#
# Keywords listed here are TAKEN from the software track: a title matching one
# of these stops being a software match and becomes an infrastructure one.
# That is how "Systems Analyst" and "Infrastructure Analyst" move to where they
