[sources.workday]
# Workday is 27.8% of all active postings in the feed and was previously
# unsupported -- the single largest coverage gap. Entries are "tenant/site" or
# "tenant.datacentre/site", taken from a company's careers URL:
#   https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
#                 ^tenant ^dc          ^site
# Boards come from discovery, which finds ~371 of them from real posting URLs.
# The eight hand-guessed entries that used to live here were removed: a config
# entry is pinned "hot" and polled every sweep, so guessing wrong meant paying
# for a dead board forever. Add here only boards you have confirmed.
# Workday caps a page at 20 and returns them unsorted, so each board is queried
# with these search terms to make those twenty relevant rather than arbitrary.
# More terms means better recall and more requests per board.
enabled = true
search = ["new grad", "software engineer"]
boards = []

[sources.smartrecruiters]
# 6.9% of the feed and the cleanest public API of the lot. ~110 boards come
# from discovery; the same "do not guess" rule as Workday applies here.
enabled = true
slugs = []

[sources.bamboohr]
# Small, but a plain public JSON endpoint and discoverable from posting URLs.
# Boards come from discovery; this list only exists for manual additions.
enabled = true
slugs = []

[sources.rippling]
enabled = true
slugs = []

[sources.workable]
# Small and mid sized employers, which is where Canadian coverage is thinnest.
# Boards come from discovery; add confirmed ones here by hand.
enabled = true
slugs = []

[sources.recruitee]
enabled = true
slugs = []

# ---------------------------------------------------------------------------
# Canada. Everything above is an applicant tracking system keyed by a company
# slug, and the slug registry is mined from SimplifyJobs, a US new grad
# aggregator. The result was a feed of 496 US roles to 24 Canadian ones. These
# are national aggregators instead: one endpoint, thousands of employers, and
# no need to know a company exists before it can be found.
#
# A source is enabled here only after the probe workflow has shown it fetching
# and parsing real postings. Job Bank has: a run on 2026-09-02 returned HTTP
# 200 and the parser read 25 live postings out of it, so it is on. The rest
# stay off until a probe says the same about them, because shipping an
# untested source as working is the exact thing this project does not do.
# ---------------------------------------------------------------------------

[sources.jobbank]
# Job Bank, run by the federal government. The widest Canadian coverage there
# is: small firms that are on no aggregator post here, and every LMIA backed
# role is required to be here. It is also the only one with no commercial
# reason to block a reader. Its results link to the employer's own careers
# page, so they feed slug discovery as well as the feed itself.
#
# The queries carry the early career words on purpose. Job Bank shows the NOC
# title, which is a bare "software developer", and the matcher's fourth gate
# wants a new grad signal in the title, so a plain role search returns hundreds
# of rows that are all filtered out again. Searching for the signal itself is
# what turns a wide net into a useful one.
#
# VERIFIED 2026-09-02: HTTP 200, 25 postings parsed, newest dated that day.
enabled = true
queries = [
  "junior software developer",
  "junior programmer",
  "entry level software developer",
  # "graduate software developer" was here and carried no signal the matcher
  # knows: the phrase list has "new graduate" and "recent graduate", not a bare
  # "graduate". It would have spent six requests a sweep and matched nothing.
  "new graduate software developer",
  "developpeur junior",
  "programmeur junior",
  # The infrastructure track's queries, and the single most important change
  # for it. The ~1200 ATS boards are American technology companies; the
  # employers this track is aimed at -- the Government of Canada, provincial
  # governments, CN and CP, Hydro-Quebec and BC Hydro, Enbridge, Suncor,
  # Teck, the universities, the health authorities, the airports -- are on
  # none of them. They are on Job Bank, because every one of them posts here
  # and many are required to.
  #
  # These carry no early career words on purpose, unlike the software queries
  # above. The whole point of this track is that the candidate should not be
  # filed as junior, and Job Bank roles arrive with no description, so they
  # land in the "level not stated" tier and stay filterable there.
  #
  # Cost: one request per query per sweep. This roughly quadruples Job Bank's
  # share of the sweep, which is affordable against a federal site built for
  # public volume, and it is the only place these employers can be found.
  "systems administrator",
  "systems analyst",
  "network administrator",
  "network analyst",
  "infrastructure analyst",
  "it operations analyst",
  "information systems analyst",
  "cybersecurity analyst",
  "information security analyst",
  "scada",
  "operational technology",
  "control systems analyst",
  "telecommunications analyst",
  "cloud administrator",
  "linux administrator",
  "rail systems",
  # French, for the Quebec and federal bilingual postings that never appear in
  # an English search.
  "administrateur de systemes",
  "analyste de systemes",
  "analyste reseau",
  "analyste en cybersecurite",
  "specialiste infrastructure",
]

[sources.jobillico]
# Quebec's largest board and effectively invisible from outside the province.
# The search term is a path segment on /recherche-emploi, and the site has no
# English search route, so French terms are as useful as English ones here.
#
# VERIFIED 2026-09-02: HTTP 200, 456 KB, 9 Quebec postings parsed with the
# employer, the city and a real date on each.
enabled = true
queries = [
  "developpeur logiciel",
  "developpeur junior",
  "programmeur junior",
  "software developer",
  "junior developer",
  # The infrastructure track, in French. Jobillico is where the Quebec
  # employers this track wants are: Hydro-Quebec, Bell, CN, the CIUSSS health
  # networks, Cascades, and the provincial ministries.
  "administrateur systeme",
  "analyste de systemes",
  "analyste reseau",
  "specialiste infrastructure",
  "analyste cybersecurite",
  "technicien informatique",
]

[sources.talentegg]
# Canadian, and new grad and campus only, so almost everything on it already
# passes the matcher's early career gate. Small but the highest signal here.
#
# VERIFIED 2026-09-02: HTTP 200, real postings parsed. It is genuinely small,
# a couple of software hits per query, and it publishes no dates, so a role
# from here shows an unknown age rather than a fake one.
enabled = true
queries = ["software", "developer", "software engineer", "engineering"]

[sources.eluta]
# Indexes Canadian employers' own careers pages rather than reselling
# postings, so its links point straight at Greenhouse, Lever and Workable
# boards. Worth more as a discovery feed than as a source of rows.
enabled = false
queries = ["software developer", "software engineer"]

[sources.getro]
# Powers the talent networks venture funds run for their portfolios. The
# Canadian ones (Inovia, Real, Golden, BDC, Georgian, OMERS, Radical, Panache)
# are a directory of exactly the employer that is invisible everywhere else:
# a hundred to three hundred people, real engineering, no aggregator presence.
#
# A network is addressed by a numeric id that only appears in its own board's
# page source, so there is nothing to guess and nothing is listed here yet.
# To add one: open the fund's jobs page, view source, search for
# "collection" or "network_id", and paste the number below.
enabled = false
collections = []

[sources.amazon]
# Brittle and unofficial. Isolated so a failure here cannot take down a sweep.
enabled = true
queries = ["software development engineer", "new grad software"]

[discovery]
# Mine ATS slugs out of the SimplifyJobs posting URLs instead of guessing them.
# Of 70 hand-written slugs, 5 appeared in the live feed; the feed's own URLs
# yielded 359 that are correct by construction.
enabled = true

[rotation]
# ~360 boards at a one-minute cadence would be ~500k requests a day and would
# get the tool blocked. Each sweep polls every "hot" board plus a rotating
# slice of the rest, so the full set is covered every few minutes while the
# per-sweep request count stays bounded.
# Discovery finds roughly 900 boards across seven platforms. At 80 per sweep
# and about one sweep a minute, every board is checked roughly every 11
# minutes, and a board that has produced a match is checked every sweep.
# These are conditional requests, so an unchanged board costs a 304 and no
# payload. That works out to about 128 requests per board per day, which is
# polite for a public job board.
cold_slice = 80
# A board that produced a match in this many days stays hot.
hot_days = 21

[sources.simplify]
# Coverage net for companies not on the three ATSs above.
# Path confirmed by reading the repo, not guessed.
enabled = true
repo = "SimplifyJobs/New-Grad-Positions"
ref = "dev"
path = ".github/scripts/listings.json"
