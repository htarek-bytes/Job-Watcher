  # software variants survive: "avionics engineer" is excluded while "Avionics
  # Software Engineer" is not, because the two words are not adjacent there.
  "electrical design",
  "materials engineer",
  "propulsion engineer",
  "avionics engineer",
  "thermal engineer",
  "optical engineer",
  "fluids engineer",
  "welding engineer",
  "composites engineer",
  "supplier quality",
  "continuous improvement",
  # A professional engineering licence is a multi-year credential, not a
