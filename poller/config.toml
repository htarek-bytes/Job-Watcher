[locations]
# US + Canada + Remote, other countries dropped.
countries = ["US", "CA"]
allow_remote = true
allow_unknown = true  # keep postings with no parseable location, and tag them

# Keep a fully remote role listed in another country when it says it hires
# anywhere, or names Canada. On a Canadian passport that is a real option, and
# dropping it for the city in its location field loses exactly the roles this
# filter cannot find any other way.
#
# It takes an explicit signal, never the bare word "remote": that is the most
# over-claimed word on a job board, and usually means one country. Presenting a
# US-only role as Canada-open costs an application, which is the expensive
# mistake here.
allow_global_remote = true

[salary]
# Pay is read out of the description, because no ATS returns it as a field.
# Only the sources that return a description can supply it at all: Greenhouse,
# Lever, Ashby, Workable and Recruitee do; Workday, SmartRecruiters, BambooHR,
# Rippling, Job Bank and the aggregator do not. So coverage is partial by
# construction, and a missing figure means "did not say", never "pays badly".
#
# Nothing is ever REJECTED for its pay. The target is recorded on each role and
# the dashboard filters on it, which keeps the judgement where it belongs: a
# posting with no figure is exactly the one worth opening.
target_cad = 80000

# USD to CAD, used only to compare a US figure against the target above, never
# shown as a converted salary. It lives here rather than in the code because it
# goes stale, and a number buried in a module goes stale silently. At this rate
# the $80,000 CAD target is about $58,400 USD.
usd_to_cad = 1.37

[notify]
priority = "urgent"
tags = "briefcase"
# The ntfy topic is read from the NTFY_TOPIC Actions secret. Never put it here:
# this file is committed and the docs/ site is public.

