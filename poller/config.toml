  "site reliability engineer",
  "embedded engineer",
  "firmware engineer",
  "qa engineer",
  "test engineer",
  "engineer software",
  "developer",
  # Development, product development, automation and infrastructure, worded
  # without the words above. "Engineer", "developer" and "programmer" already
  # cover DevOps Engineer, Cloud Engineer, Automation Engineer, Build Engineer
  # and Web Developer, so the gap is only the titles carrying none of the
  # three. These are two-word phrases rather than bare words on purpose:
  # a bare "automation" would take Marketing Automation Specialist, and a bare
