# Job watcher configuration. Edit this file, not the code.
#
# The lists below have been VERIFIED against the live endpoints.
# A verify run on 2026-09-02 checked 912 boards: 874 OK, 6 empty, 32 dead.
# Every dead entry was one of the original hand-guessed slugs, and they have
# been removed. The boards that work almost all came from discovery, which
# reads them out of real posting URLs rather than guessing.

[match]
max_level = 1

# Internships are matched as a second KIND rather than mixed into the new grad
# list, so the dashboard can show them separately or hide them. They used to be
# a flat exclusion. Turning this off puts every phrase below back to being an
# exclusion, which is the old behaviour exactly.
include_internships = true

# Accept a software role with no seniority marker at all: "Developer, Rust",
# "Full Stack Software Developer", "Firmware Engineer". Not new grad, not
# senior, and at a two hundred person company often open to a strong new
# graduate.
#
# This applies to CANADIAN boards only, enforced in cli.py rather than here.
# An audit of 90 Canadian boards found 63 of these dropped against 122 total
# matches, so it is the largest recoverable group on that side. Accepting them
# from all ~990 boards would bury the new grad results under US mid-level
# roles instead. They are tagged "open level" so they stay distinguishable.
include_open_level = true

# Accept a role whose own description asks for at most this many years. Not
# every posting says, and one that says nothing is not read as zero: it falls
# through to the tiers above. Stronger evidence than "no seniority stated",
# because the posting states the bar rather than leaving it unsaid, so this
# applies everywhere rather than to Canadian boards only.
#
# Only the sources that return a description can supply it: Greenhouse, Lever,
# Ashby, Workable and Recruitee do; Workday, SmartRecruiters, BambooHR,
# Rippling, Job Bank and the aggregator do not. So coverage here is partial by
# construction, not by choice. Tagged "0 to 3 years" so it stays filterable.
max_years_experience = 3
internship_phrases = [
  "intern",
  "interns",
  "internship",
  "co op",
  "coop",
  "summer intern",
  "student intern",
  "industrial placement",
  # A bare "student" was here and is too broad, in the same way a bare "ii"
  # was: it matches the word in "Software Engineer, Student Experience", which
  # is a permanent role at an education company, and filing that under
  # internships hides it from anyone filtering to new grad.
]

# Gate 1: the title has to name a role worth waking up for.
role_keywords = [
  "software engineer",
  "software engineering",
  "software developer",
  "software development engineer",
  "sde",
  "swe",
  "programmer",
  "data engineer",
