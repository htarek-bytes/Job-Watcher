name: verify sources

# Run this FIRST, and before trusting any slug in poller/config.toml.
# It pings every configured slug and reports which ones return real data.
# It writes no state and sends no notifications.
on:
  workflow_dispatch:
    inputs:
      include_discovered:
        description: "also verify the ~420 auto-discovered boards (slow)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python -m unittest discover -s poller/tests -v

      - name: Verify every configured slug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.include_discovered }}" = "false" ]; then
            python poller/cli.py verify | tee verify-report.txt
          else
            python poller/cli.py verify --include-discovered | tee verify-report.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: verify-report.txt
