name: poll

on:
  schedule:
    # Five minutes is the floor GitHub allows for ONE cron entry, but a
    # workflow may carry several, and each is scheduled independently. Five
    # entries offset by a minute each fire this workflow roughly every minute.
    #
    # Be clear about what this does and does not buy. It shortens the GAP
    # between sweeps from five minutes to about one. It does NOT remove the
    # 10-20 minute scheduler jitter, and it does not stop GitHub dropping
    # scheduled runs under load -- it only means a dropped fire is followed by
    # another one a minute later instead of five. The jitter floor is why a
    # genuinely fast lane still has to live outside Actions.
    #
    # Offsets avoid :00 and :05, where every cron on GitHub fires at once.
    - cron: "1-59/5 * * * *"
    - cron: "2-59/5 * * * *"
    - cron: "3-59/5 * * * *"
    - cron: "4-59/5 * * * *"
    - cron: "0-59/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal sweep, seed = mark everything seen, probe = check the Canadian sources, hunt = find Canadian ATS boards"
        type: choice
        options: [run, seed, notify-test, probe, hunt, audit]
        default: run
      dry_run:
        description: "print notifications instead of sending them"
        type: boolean
        default: false

permissions:
  contents: write

# Never let two sweeps race on the state commit. Queue instead of cancelling,
# so a slow sweep does not silently drop the postings it already fetched.
# At most one run is pending at a time, so a minute-by-minute schedule cannot
# build a backlog: a newer fire replaces the waiting one rather than stacking.
concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # A sweep finishes in well under a minute. `hunt` is the outlier: it tries
    # ~1700 guessed slugs and needs room, so the limit is set for it rather
    # than for the common case, which is bounded by the cron cadence anyway.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install step on purpose: the poller is standard library only,
      # so a sweep never waits on dependency resolution or a flaky index.

      - name: Unit tests
        run: python -m unittest discover -s poller/tests

      # Discovery also runs inside every sweep off the payload already fetched;
      # this step exists so a fresh checkout starts with a full board list
      # rather than learning it one sweep at a time.
      - name: Refresh discovered boards
        if: ${{ inputs.mode == 'seed' }}
        run: python poller/cli.py discover

      - name: Sweep
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.mode }}" = "probe" ]; then
            # Reads the Canadian endpoints and writes nothing. It lives on this
            # workflow rather than its own because workflow_dispatch only lists
            # workflows that exist on the default branch, and this one has to be
            # runnable from a feature branch to be any use before merging.
            python poller/cli.py probe --candidates --dump 6000
          elif [ "${{ inputs.mode }}" = "audit" ]; then
            # Reports what the Canadian boards drop and why. Writes nothing.
            python poller/cli.py audit
          elif [ "${{ inputs.mode }}" = "hunt" ]; then
            # Tries every Canadian name in poller/canada_seed.txt as a slug on
            # every platform, and writes only the boards that answered.
            python poller/cli.py hunt --write
          elif [ "${{ inputs.mode }}" = "notify-test" ]; then
            python poller/cli.py notify-test
          elif [ "${{ inputs.mode }}" = "seed" ]; then
            python poller/cli.py seed
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            python poller/cli.py run --dry-run
          else
            python poller/cli.py run
          fi

      # `hunt` writes the registry and nothing else, so its commit is wanted;
      # `probe` writes nothing at all.
      - name: Commit state
        if: ${{ inputs.mode != 'probe' && inputs.mode != 'audit' }}
        run: |
          set -u
          BRANCH="${GITHUB_REF_NAME}"

          git config user.name  "job-watcher"
          git config user.email "job-watcher@users.noreply.github.com"
          # Resolve data/ with tools/merge-state.py instead of by line. A merge
          # driver has to be registered in git config, which does not travel
          # with a checkout, so it is set here as well as documented in
          # .gitattributes. Without it a concurrent sweep's data/ conflicts
          # cannot be resolved and the push never lands.
          git config merge.jobstate.name "job watcher state merge"
          git config merge.jobstate.driver "python3 tools/merge-state.py %O %A %B %P"

          git add data/
          if git diff --cached --quiet; then
            echo "no state change"
            exit 0
          fi
          git commit -m "state: sweep $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"

          # A sweep can start from a stale base: actions/checkout takes
          # github.sha, which is fixed when the RUN IS CREATED, not when the
          # job starts. A run that waited in the concurrency queue therefore
          # checks out a commit from before the sweep ahead of it pushed, and
          # its own push is rejected as non fast forward.
          #
          # `git push` with no refspec is also wrong here: that checkout leaves
          # a detached HEAD, so it failed with "You are not currently on a
          # branch" and never pushed anything. HEAD:branch works either way.
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${BRANCH}"; then exit 0; fi
            echo "push rejected, merging remote state (attempt $attempt)"

            # Any half finished merge from the previous attempt has to go
            # first. The old loop used `git pull --rebase`, and when that hit a
            # data/ conflict it left the tree mid rebase with unmerged files,
            # so every later attempt failed on the leftovers rather than on the
            # actual push. That is what turned one lost race into a red run.
            git merge --abort 2>/dev/null || true
            git rebase --abort 2>/dev/null || true

            git fetch origin "${BRANCH}" || true
            if git merge --no-edit "origin/${BRANCH}"; then
              continue
            fi
            echo "merge left conflicts outside data/, abandoning this attempt" >&2
            git merge --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "could not push state after 4 attempts" >&2
          exit 1
